<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaardhi Farms clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- header -->
    <header>
        <nav>
            <div class="container nav-container">
                <div class="bars">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="logo">
                    <a><img src="Assets/VF_logo_final-02.avif" alt="Logo"></a>
                </div>
                <ul class="list">
                    <li><a href="#Home">Home</a></li>
                    <li><a href="#Home">View Collections</a></li>
                    <li><a href="#Home">Shop All</a></li>
                    <li><a href="#Home">FAQ</a></li>
                    <li><a href="#Home">Track Your Order</a></li>
                    <li><a href="#Home">Contact Us</a></li>
                    <li><a href="#Home">Work With Us</a></li>
                </ul>
                <div class="icons">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-user user"></i>
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
            </div>
        </nav>
        <hr>
    </header>
    <!-- main -->
    <main>
        <section class="sotries">
            <div class="stories-container">
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/Honey1.webp" alt="Honey1">
                    </div>
                    <p>Honey</p>
                </div>
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/Ghee_HighRes.webp" alt="Ghee">
                    </div>
                    <p>Ghee</p>
                </div>
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/Photoroom-20250117_174904.webp" alt="Oils">
                    </div>
                    <p>Oils</p>
                </div>
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/AviseLaddu.webp" alt="Sweets & Snacks">
                    </div>
                    <p>Sweets & Snacks</p>
                </div>
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/pickle_collection_image_-_v1.webp" alt="Pickle">
                    </div>
                    <p>Pickles</p>
                </div>
                <div class="product-details">
                    <div class="product">
                        <img src="Assets/Photoroom-20250120_162613_1.webp" alt="New Launch">
                    </div>
                    <p>New Launch</p>
                </div>
            </div>
        </section>
        <div class="hero-banner">
            <img src="Assets/thali_vr_banner_copy_461d5ad3-f49f-49aa-a46d-873721f80b12.webp" alt="">
        </div>
        <section class="shopping">
            <div class="container shopping-container">
                <h2>Shop Our Customers Favorite</h2>
                <div class="best-arrival">
                    <p>Best Sellers</p>
                    <p>New Arrivals</p>
                </div>
                <div class="products-cart">
                    <div class="product-cart">
                        <div class="product-cart-img">
                            <img src="Assets/20250405_164532.webp" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
